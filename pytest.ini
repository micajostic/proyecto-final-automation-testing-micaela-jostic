[pytest]
pythonpath = .
testpaths = tests
markers =
    ui: pruebas de interfaz web con Selenium
    api: pruebas de API con Requests
addopts = --html=reports/reporte.html --self-contained-html
log_file = logs/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S